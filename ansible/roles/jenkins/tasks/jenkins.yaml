---
- name: Download Jenkins repository signing key
  get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /etc/apt/keyrings/jenkins-keyring.asc

- name: Add Jenkins repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
    filename: jenkins
    state: present

- name: Update apt cache
  apt:
    update_cache: true

- name: Install Jenkins
  apt:
    name: jenkins
    state: present

- name: Add Jenkins user to Docker group
  user:
    name: jenkins
    groups:
      - docker
    append: true
  notify: Restart Jenkins

- name: Enable Jenkins service
  systemd:
    name: jenkins
    enabled: true
    state: started

- name: Apply Jenkins handler before verification
  meta: flush_handlers

- name: Verify Jenkins status
  command: 
    cmd: systemctl is-active jenkins
  register: jenkins_status
  changed_when: false

- name: Display Jenkins status
  debug:
    var: jenkins_status.stdout